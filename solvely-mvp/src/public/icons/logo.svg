<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="AI Test Case Logo">
  <!-- 占位 Logo：你可以用图四覆盖此文件（同名替换即可） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF74B8"/>
      <stop offset="1" stop-color="#FFB35C"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#g)" filter="url(#s)"/>
  <circle cx="96" cy="110" r="18" fill="#fff"/>
  <circle cx="160" cy="110" r="18" fill="#fff"/>
  <circle cx="96" cy="110" r="10" fill="#111"/>
  <circle cx="160" cy="110" r="10" fill="#111"/>
  <path d="M76 154c18 22 86 22 104 0" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round"/>
  <path d="M52 66l22 14" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <path d="M204 66l-22 14" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
</svg>

