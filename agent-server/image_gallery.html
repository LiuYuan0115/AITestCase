<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV图片加载</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .image-container {
                @apply relative overflow-hidden rounded-lg shadow-md transition-all duration-300 hover:shadow-xl cursor-pointer;
            }
            .image-wrapper {
                @apply aspect-video w-full bg-gray-100 flex items-center justify-center;
            }
            .image-loading {
                @apply animate-pulse text-gray-400;
            }
            .modal-backdrop {
                @apply fixed inset-0 bg-black/80 z-50 flex items-center justify-center opacity-0 transition-opacity duration-300 pointer-events-none;
            }
            .modal-backdrop.active {
                @apply opacity-100 pointer-events-auto;
            }
            .modal-content {
                @apply max-w-5xl w-full max-h-[90vh] p-4 transform scale-95 transition-transform duration-300;
            }
            .modal-backdrop.active .modal-content {
                @apply scale-100;
            }
            .pagination-btn {
                @apply px-4 py-2 rounded transition-all duration-200;
            }
            .pagination-btn:enabled {
                @apply bg-primary text-white hover:bg-primary/90;
            }
            .pagination-btn:disabled {
                @apply bg-gray-200 text-gray-500 cursor-not-allowed;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm py-6 px-4 md:px-6">
        <div class="container mx-auto">
            <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-gray-800">
                图片展示 Gallery
            </h1>
            <p class="text-gray-600 mt-2">共 1741 张图片，每页显示 100 张，点击图片可放大查看</p>
        </div>
    </header>

    <main class="container mx-auto py-8 px-4 md:px-6">
        <!-- 图片网格容器 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="imageGrid">
            <!-- 图片将通过JavaScript动态生成 -->
        </div>

        <!-- 分页控件 -->
        <div class="pagination flex flex-col sm:flex-row justify-center items-center mt-8 gap-4">
            <button id="prevPage" class="pagination-btn" onclick="changePage(-1)">
                <i class="fa fa-chevron-left mr-1"></i> 上一页
            </button>
            <div class="text-gray-700 text-center">
                第 <span id="currentPage">1</span> 页 / 共 <span id="totalPages">18</span> 页
            </div>
            <button id="nextPage" class="pagination-btn" onclick="changePage(1)">
                下一页 <i class="fa fa-chevron-right ml-1"></i>
            </button>
        </div>
    </main>

    <!-- 图片放大模态框 -->
    <div id="imageModal" class="modal-backdrop" onclick="closeImageModal(event)">
        <div class="modal-content bg-white rounded-lg shadow-2xl">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modalTitle" class="text-xl font-semibold text-gray-800"></h3>
                <button onclick="closeImageModal(event)" class="text-gray-500 hover:text-gray-800 transition-colors">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="flex justify-center items-center">
                <img id="modalImage" src="" alt="大图预览" class="max-w-full max-h-[70vh] object-contain">
            </div>
            <div class="mt-4 text-sm text-gray-600">
                <p id="modalUrl"></p>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t mt-12 py-6 px-4 md:px-6">
        <div class="container mx-auto text-center text-gray-600 text-sm">
            <p>图片展示页面 - 由CSV数据生成</p>
        </div>
    </footer>

        const totalPages = 18;
        let currentPage = 0; // 从0开始的索引

        // 页面加载完成后渲染第一页
        document.addEventListener('DOMContentLoaded', () => {
            renderPage(currentPage);
        });

        // 渲染指定页的图片
        function renderPage(pageIndex) {
            const imageGrid = document.getElementById('imageGrid');
            imageGrid.innerHTML = ''; // 清空当前页面图片

            // 获取当前页的图片数据
            const pageImages = pages[pageIndex];

            // 动态生成图片元素
            pageImages.forEach(item => {
                const imageHtml = `
                <div class="image-container group" onclick="openImageModal('${item.url}', '图片 (行号: ${item.row_num})')">
                    <div class="image-wrapper">
                        <img 
                            src="${item.url}" 
                            alt="从CSV加载的图片 (行号: ${item.row_num})" 
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                            loading="lazy"
                            onload="this.parentElement.querySelector('.image-loading').classList.add('hidden')"
                            onerror="handleImageError(this)"
                        >
                        <div class="image-loading absolute inset-0 flex items-center justify-center">
                            <i class="fa fa-image fa-3x"></i>
                        </div>
                    </div>
                    <div class="p-3 bg-white">
                        <p class="text-sm text-gray-600 truncate">${item.url}</p>
                        <p class="text-xs text-gray-500 mt-1">行号: ${item.row_num}</p>
                    </div>
                </div>
                `;
                imageGrid.innerHTML += imageHtml;
            });

            // 更新页码显示
            document.getElementById('currentPage').textContent = pageIndex + 1;

            // 更新分页按钮状态
            document.getElementById('prevPage').disabled = pageIndex === 0;
            document.getElementById('nextPage').disabled = pageIndex === totalPages - 1;
        }

        // 切换页码
        function changePage(delta) {
            const newPage = currentPage + delta;
            // 检查是否在有效页码范围内
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                renderPage(currentPage);
                // 滚动到页面顶部
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        // 图片加载错误处理
        function handleImageError(img) {
            img.src = 'https://picsum.photos/400/300?grayscale&blur=2';
            img.alt = '图片加载失败: ' + img.alt;
            if (img.parentElement.querySelector('.image-loading')) {
                img.parentElement.querySelector('.image-loading').classList.add('hidden');
            }
        }

        // 图片放大模态框功能
        function openImageModal(imageUrl, title) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalUrl = document.getElementById('modalUrl');

            modalImage.src = imageUrl;
            modalTitle.textContent = title;
            modalUrl.textContent = imageUrl;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // 防止背景滚动
        }

        function closeImageModal(event) {
            // 如果点击的是模态框背景或关闭按钮，则关闭
            if (event.target === document.getElementById('imageModal') || 
                event.target.closest('button[onclick="closeImageModal(event)"]')) {
                const modal = document.getElementById('imageModal');
                modal.classList.remove('active');
                document.body.style.overflow = ''; // 恢复背景滚动
            }
        }

        // 按ESC键关闭模态框
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                const modal = document.getElementById('imageModal');
                if (modal.classList.contains('active')) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }
        });
    </script>
